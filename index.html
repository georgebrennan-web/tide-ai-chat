<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crest – AI chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f9;--panel:#e8ecf4;--card:#fff;--ink:#16203a;--muted:#6a7590;--line:#d8deea;--accent:#3550e8;--accent-ink:#fff;--user:#e1e7fb;--code:#14192b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1424;--panel:#161c31;--card:#1b2240;--ink:#e8ecfa;--muted:#8d97b5;--line:#2a3354;--accent:#7b8dff;--accent-ink:#0f1424;--user:#243063;--code:#0a0e1b}}
:root[data-theme="dark"]{--bg:#0f1424;--panel:#161c31;--card:#1b2240;--ink:#e8ecfa;--muted:#8d97b5;--line:#2a3354;--accent:#7b8dff;--accent-ink:#0f1424;--user:#243063;--code:#0a0e1b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 'Schibsted Grotesk',system-ui,sans-serif}
.app{display:flex;height:100%}
aside{width:272px;background:var(--panel);display:flex;flex-direction:column;padding:14px;gap:10px;border-right:1px solid var(--line);transition:transform .2s}
.brand{font-weight:700;font-size:22px;letter-spacing:-.02em;padding:4px 6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.new{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 12px;font-weight:600}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;border-radius:8px;padding:8px 10px;gap:6px;border:0;background:none;text-align:left;width:100%}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.on,.item:hover{background:var(--card)}
.item .x{opacity:0;color:var(--muted);padding:0 4px}
.item:hover .x,.item.on .x{opacity:1}
.foot{display:flex;gap:8px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);flex:1}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.menu{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.scroll{flex:1;overflow:auto;padding:24px 16px}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.empty{margin:12vh auto 0;max-width:640px;text-align:left}
.empty h1{font-size:clamp(30px,5vw,46px);line-height:1.1;letter-spacing:-.03em;margin:0 0 10px}
.empty p{color:var(--muted);margin:0 0 22px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.chip:hover{border-color:var(--accent)}
.msg{display:flex;flex-direction:column;max-width:100%}
.msg.user{align-self:flex-end;background:var(--user);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{overflow-wrap:anywhere}
.msg.ai p{margin:0 0 .8em}.msg.ai ul,.msg.ai ol{margin:0 0 .8em;padding-left:1.4em}
.msg.ai h3,.msg.ai h4{margin:.8em 0 .4em}
.msg.ai code{background:var(--panel);padding:1px 5px;border-radius:5px;font:.9em ui-monospace,Menlo,monospace}
.msg.ai pre{background:var(--code);color:#e6eaff;border-radius:10px;padding:12px 14px;overflow-x:auto;margin:0 0 .9em}
.msg.ai pre code{background:none;padding:0;color:inherit}
.dots{color:var(--muted)}
.err{color:#c23a3a}
.dock{padding:0 16px 16px}
.box{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 14px}
.box:focus-within{border-color:var(--accent)}
textarea{flex:1;border:0;background:none;color:inherit;font:inherit;resize:none;max-height:200px;padding:6px 0;outline:none}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;width:40px;height:40px;font-size:18px;font-weight:700}
.send:disabled{opacity:.4;cursor:default}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
@media (max-width:760px){
aside{position:fixed;z-index:5;top:0;bottom:0;left:0;padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-100%)}
aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
.top{display:flex}}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand">Tide</div>
  <button class="new" id="new">New chat</button>
  <div class="list" id="list"></div>
  <div class="foot"><button class="ghost" id="theme">Toggle theme</button><button class="ghost" id="clear">Clear all</button></div>
</aside>
<main>
  <div class="top"><button class="menu" id="menu" aria-label="Open chats">Chats</button><strong>Tide</strong></div>
  <div class="scroll" id="scroll"><div class="col" id="col"></div></div>
  <div class="dock">
    <div class="box">
      <textarea id="in" rows="1" placeholder="Message Tide" aria-label="Message"></textarea>
      <button class="send" id="send" aria-label="Send message">↑</button>
    </div>
    <div class="note">Tide can make mistakes. Check important information.</div>
  </div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const SYS="You are Tide, a friendly, concise, helpful AI assistant. Use simple markdown (short paragraphs, lists, fenced code blocks) when it helps.";
const PROMPTS=["Explain how neural networks learn, simply","Write a Python function that checks for palindromes","Help me plan a 3-day trip to Japan","Give me 5 ideas for a weekend project"];
let chats=[],cur=null,sample=null,busy=false,ctrl=null;
try{chats=JSON.parse(localStorage.getItem("tide.chats")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("tide.chats",JSON.stringify(chats))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(t){
  if((t.match(/```/g)||[]).length%2)t+="\n```";
  const parts=t.split(/```/);
  return parts.map((p,i)=>{
    if(i%2){const c=p.replace(/^[^\n]*\n/,"");return "<pre><code>"+esc(c.replace(/\n$/,""))+"</code></pre>"}
    let h=esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
    return h.split(/\n{2,}/).map(b=>{
      const L=b.split("\n");
      if(L.every(l=>/^\s*[-*] /.test(l)))return "<ul>"+L.map(l=>"<li>"+l.replace(/^\s*[-*] /,"")+"</li>").join("")+"</ul>";
      if(L.every(l=>/^\s*\d+[.)] /.test(l)))return "<ol>"+L.map(l=>"<li>"+l.replace(/^\s*\d+[.)] /,"")+"</li>").join("")+"</ol>";
      if(/^#{1,4} /.test(b))return "<h3>"+b.replace(/^#{1,4} /,"")+"</h3>";
      return b.trim()?"<p>"+L.join("<br>")+"</p>":"";
    }).join("");
  }).join("");
}
function renderList(){
  const l=$("list");l.innerHTML="";
  chats.forEach(c=>{
    const b=document.createElement("button");b.className="item"+(c.id===cur?" on":"");
    const s=document.createElement("span");s.textContent=c.title;
    const x=document.createElement("span");x.className="x";x.textContent="✕";x.title="Delete chat";
    x.onclick=e=>{e.stopPropagation();chats=chats.filter(k=>k.id!==c.id);if(cur===c.id)cur=null;save();renderAll()};
    b.append(s,x);b.onclick=()=>{cur=c.id;renderAll();$("side").classList.remove("open")};l.append(b);
  });
}
function renderChat(){
  const col=$("col");col.innerHTML="";
  const c=chats.find(k=>k.id===cur);
  if(!c||!c.msgs.length){
    const e=document.createElement("div");e.className="empty";
    e.innerHTML="<h1>What are we working on?</h1><p>Ask a question, draft something, or debug some code.</p>";
    const g=document.createElement("div");g.className="chips";
    PROMPTS.forEach(p=>{const b=document.createElement("button");b.className="chip";b.textContent=p;b.onclick=()=>send(p);g.append(b)});
    e.append(g);col.append(e);return;
  }
  c.msgs.forEach(m=>col.append(bubble(m)));
  $("scroll").scrollTop=1e9;
}
function bubble(m){
  const d=document.createElement("div");d.className="msg "+(m.role==="user"?"user":"ai");
  if(m.role==="user")d.textContent=m.content;else d.innerHTML=m.content?md(m.content):'<span class="dots">Thinking…</span>';
  return d;
}
function renderAll(){renderList();renderChat()}
async function send(text){
  text=(text||$("in").value).trim();
  if(!text||busy)return;
  if(!sample){alert("AI isn't available in this view. Open the published page and allow access when asked.");return}
  let c=chats.find(k=>k.id===cur);
  if(!c){c={id:String(Date.now()),title:text.slice(0,40),msgs:[]};chats.unshift(c);cur=c.id}
  c.msgs.push({role:"user",content:text});
  const reply={role:"assistant",content:""};c.msgs.push(reply);
  $("in").value="";$("in").style.height="auto";
  renderAll();
  const el=$("col").lastElementChild;
  busy=true;$("send").textContent="■";$("send").setAttribute("aria-label","Stop");
  ctrl=new AbortController();
  const hist=c.msgs.slice(0,-1).map(m=>({role:m.role,content:m.content}));
  hist[0]={role:"user",content:"["+SYS+"]\n\n"+hist[0].content};
  try{
    const r=await sample(hist,{cache:false,signal:ctrl.signal,onText:({text})=>{reply.content=text;el.innerHTML=md(text);$("scroll").scrollTop=1e9}});
    reply.content=r.text;el.innerHTML=md(r.text);
  }catch(e){
    if(e&&e.text)reply.content=e.text;
    if(!(e&&e.name==="AbortError")){
      const msg=e&&e.code==="rate_limited"?"Too many requests. Wait a moment and try again.":e&&e.code==="not_granted"?"Access to AI was declined. Reload and allow it to chat.":"Something went wrong. Try sending your message again.";
      reply.content=(reply.content?reply.content+"\n\n":"")+msg;
    }
    if(!reply.content)c.msgs.pop();
    el.innerHTML=md(reply.content||"");
  }
  busy=false;ctrl=null;$("send").textContent="↑";$("send").setAttribute("aria-label","Send message");
  save();renderList();
}
$("send").onclick=()=>busy?ctrl&&ctrl.abort():send();
$("in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("send").click()}});
$("in").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,200)+"px"});
$("new").onclick=()=>{cur=null;renderAll();$("side").classList.remove("open");$("in").focus()};
$("menu").onclick=()=>$("side").classList.toggle("open");
$("clear").onclick=()=>{if(confirm("Delete all chats?")){chats=[];cur=null;save();renderAll()}};
$("theme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0f1424";r.dataset.theme=d?"light":"dark"};
renderAll();
(async()=>{try{sample=await claude.use("sample")}catch(e){sample=null}})();
</script>
</body>
</html>
